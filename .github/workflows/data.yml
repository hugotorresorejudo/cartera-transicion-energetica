name: Actualizar datos

on:
  schedule:
    - cron: "17 5 * * *"   # diario, 05:17 UTC
  workflow_dispatch:
    inputs:
      pvgis:
        description: "Regenerar también PVGIS (52 capitales; tarda ~15 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install numpy pandas requests pyyaml

      - name: Descargar OMIE y REData (y ESIOS si hay token)
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Regenerar PVGIS (manual o el día 1 de cada mes)
        if: ${{ github.event.inputs.pvgis == 'true' }}
        run: python scripts/fetch_data.py --pvgis --forzar

      - name: PVGIS mensual (día 1) o si faltan ficheros
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ ! -f app/data/pvgis/pv_28.npz ] || [ "$(find app/data/pvgis -name '*.npz' | wc -l)" -lt 52 ]; then
            python scripts/fetch_data.py --pvgis --forzar
          fi

      - name: Generar copia JSON de referencias y método
        run: |
          pip install pyyaml
          python scripts/merge_refs.py
          python scripts/build_metodo.py

      - name: Comprobar tamaño de app/data
        run: |
          du -sh app/data
          test "$(du -sm app/data | cut -f1)" -le 25

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data docs/pendientes.md || true
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Datos: actualización automática" && git push; fi
