mercado.mecanismo_ajuste_gas_descripcion:
  valor: "RDL 10/2022 (13 mayo, BOE 14 mayo): mecanismo ibérico de ajuste que fija un precio de referencia del gas (tope) 40 EUR/MWh los primeros 6 meses, +5 EUR/MWh cada mes hasta 70 EUR/MWh; duracion 12 meses (hasta 31 mayo 2023); aplicable desde 14 junio 2022. Las centrales de ciclo combinado, carbon y cogeneracion sin regimen regulado peninsulares ofertan con el gas topado; la diferencia con el coste real del gas la pagan las unidades de adquisicion (consumidores comercializadores) como compensacion. No aplica a contratos bilaterales fisicos. Hoy extinguido."
  unidad: "texto"
  fuente: "BOE RDL 10/2022 (via resumen Comillas IIT, Clifford Chance, Cuatrecasas)"
  url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7843"
  fecha_consulta: "2026-10-19"
  verificado: false
  nota: "Datos de fuentes secundarias; discrepancia sobre duracion del tramo inicial (6 vs 7 meses). Identificador BOE-A-2022-7843 no confirmado en busqueda."
mercado.precio_pvpc_descripcion:
  valor: "PVPC: tarifa regulada para consumidores <=10 kW. Termino de potencia y de energia regulados; el termino de energia se indexa al mercado horario. Desde 1 ene 2024 (RD 446/2023, BOE-A-2023-14048) se pondera con mercados a plazo: 25% en 2024, 40% en 2025, 55% en 2026 (resto, mercado diario/intradiario). Peajes y cargos por periodos P1-P3 (2.0TD)."
  unidad: "texto"
  fuente: "RD 446/2023, BOE (via eseficiencia.es / MITECO)"
  url: "https://boe.es/boe/dias/2023/06/14/pdfs/BOE-A-2023-14048.pdf"
  fecha_consulta: "2026-10-19"
  verificado: false
  nota: "Calendario 25/40/55% de fuente secundaria (eseficiencia); no vi el texto BOE. Pesos de 2026 a confirmar."
